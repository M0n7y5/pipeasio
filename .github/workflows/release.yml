name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archlinux-binaries:
    name: Arch/CachyOS x86_64 tarball
    runs-on: ubuntu-latest
    # Rolling SDK versions are recorded in BUILD-INFO.txt and the release manifest.
    container: archlinux:latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm gcc cmake ninja pkgconf git curl wine libpipewire pipewire mingw-w64-gcc qt6-base yaml-cpp libarchive zlib

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (64-bit + opt-in 32-bit WoW64)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_WOW64_32=ON -DWINE_LIB_ROOT=/usr/lib/wine

      - name: Build
        run: cmake --build build

      - name: Test (gates the release)
        run: ctest --test-dir build --output-on-failure

      - name: Stage install tree
        run: DESTDIR="$PWD/stage" cmake --install build --prefix /usr

      - name: Verify the artifacts import no PipeWire newer than the floor
        run: |
          set -euo pipefail
          deb='libpipewire-0.3-0t64_1.4.2-1%2Bsteamrt4.1%2Bbsrt4.2_amd64.deb'
          work="$(mktemp -d)"
          curl -fsSL -o "$work/pw.deb" \
            "https://repo.steampowered.com/steamrt4/apt/pool/main/p/pipewire/${deb}"
          ( cd "$work" && ar x pw.deb && tar xf data.tar.* )
          floor_lib=("$work"/usr/lib/*/libpipewire-0.3.so.0.*)
          test -f "${floor_lib[0]}" || {
            echo "::error::no libpipewire in ${deb}"
            exit 1
          }
          tests/distro/check_pipewire_imports.sh "${floor_lib[0]}" \
            stage/usr/lib/wine/x86_64-unix/pipeasio64.so \
            stage/usr/lib/wine/x86_64-unix/pipeasio32.so

      - name: Write BUILD-INFO.txt
        run: |
          glibc=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          printf '%s\n' \
            "PipeASIO ${TAG} - prebuilt binaries (Arch Linux / CachyOS family, x86_64)" \
            "" \
            "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "Commit:           ${GITHUB_SHA}" \
            "Wine (build SDK): $(wine --version)" \
            "glibc:            ${glibc}" \
            "libpipewire-0.3:  $(pkg-config --modversion libpipewire-0.3) (built against; minimum 1.4.2)" \
            "MinGW (PE halves): $(x86_64-w64-mingw32-gcc -dumpversion)" \
            "Kernel:           $(uname -sr)" \
            "" \
            "Contents:" \
            "  lib/wine/x86_64-windows/pipeasio64.dll   (PE front end)" \
            "  lib/wine/x86_64-unix/pipeasio64.so       (unixlib: the PipeWire client)" \
            "  lib/wine/i386-windows/pipeasio32.dll     (opt-in 32-bit WoW64 PE front end)" \
            "  lib/wine/x86_64-unix/pipeasio32.so       (its unixlib)" \
            "  share/pipeasio/manager/pipeasio-check.exe (installation-only probe)" \
            "  share/pipeasio/manager/pipeasio-check32.exe (32-bit installation-only probe)" \
            "  bin/pipeasio-register, bin/pipeasio-settings, bin/pipeasio-manage" \
            "" \
            "Install (system-wide):  sudo tar -xzf <this>.tar.gz -C /usr && pipeasio-register" \
            "Install (user-local):   tar -xzf <this>.tar.gz -C \"\$HOME/.local\"" \
            "Proton / Faugus:        extract to \"\$HOME/.local\", then set" \
            "                        WINEDLLPATH=\"\$HOME/.local/lib/wine\" in the launcher" \
            "" \
            "COMPATIBILITY: the ELF .so halves are linked against the Wine and glibc" \
            "shown above. A different Wine version or an older glibc may fail to load" \
            "(regsvr32 c0000135). Build from source in that case. See the README." \
            "PipeWire is the exception: it is resolved at run time and any" \
            "libpipewire-0.3 from 1.4.2 up works. These exact .so files were" \
            "checked at release time - every PipeWire symbol they import exists in" \
            "the 1.4.2 that Proton's steamrt4 runtime loads." \
            > stage/usr/BUILD-INFO.txt
          cat stage/usr/BUILD-INFO.txt

      - name: Package tarball
        run: |
          art="pipeasio-${TAG}-archlinux-x86_64.tar.gz"
          tar -czf "$art" -C stage/usr .
          sha256sum "$art" | tee "$art.sha256"
          echo "ART=$art" >> "$GITHUB_ENV"

      - name: Generate release manifest
        run: >
          build/manager/pipeasio-manage manifest --version "$TAG" --asset "$ART"
          --root stage/usr --architecture x86_64 --wine-sdk "$(wine --version)"
          --output pipeasio-release-x86_64.json

      - name: Upload driver release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-driver-x86_64
          if-no-files-found: error
          path: |
            pipeasio-*.tar.gz
            pipeasio-*.tar.gz.sha256
            pipeasio-release-x86_64.json

      - name: Upload installation probes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manager-probes
          if-no-files-found: error
          path: build/manager/pipeasio-check*.exe

  debian-arm64-binaries:
    name: Debian aarch64 tarball
    runs-on: ubuntu-24.04-arm
    # Debian is the ARM64 distribution whose Wine ships the aarch64-windows
    # import libraries (#23). Its rolling SDK versions are recorded in
    # BUILD-INFO.txt and in this job's half of the release manifest.
    container: docker.io/library/debian:stable
    # The runner falls back to sh (dash) inside this container; the steps below
    # are bash.
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ clang lld pkg-config binutils \
            wine wine64-tools libwine-dev libpipewire-0.3-dev pipewire \
            qt6-base-dev libyaml-cpp-dev libarchive-dev zlib1g-dev \
            git ca-certificates file

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (driver + manager CLI, no Qt panel)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SETTINGS_PANEL=OFF -DBUILD_MANAGER=ON

      - name: Build
        run: cmake --build build

      - name: Test (gates the release; Wine integration tests skip without a PipeWire daemon)
        run: ctest --test-dir build --output-on-failure

      - name: Stage install tree
        run: DESTDIR="$PWD/stage" cmake --install build --prefix /usr

      - name: Verify the artifacts import no PipeWire newer than the floor
        run: |
          set -euo pipefail
          # steamrt4 has no ARM64 build, so the floor this tarball can honestly
          # claim is Debian stable's own libpipewire. It is what BUILD-INFO.txt
          # and the manifest's compatibility block report as the minimum.
          libdir="$(pkg-config --variable=libdir libpipewire-0.3)"
          floor_lib=("${libdir:-/usr/lib/aarch64-linux-gnu}"/libpipewire-0.3.so.0.*)
          test -f "${floor_lib[0]}" || {
            echo "::error::no libpipewire-0.3 runtime library in ${libdir}"
            exit 1
          }
          tests/distro/check_pipewire_imports.sh "${floor_lib[0]}" \
            stage/usr/lib/wine/aarch64-unix/pipeasio64.so

      - name: Write BUILD-INFO.txt
        run: |
          glibc=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          pipewire=$(pkg-config --modversion libpipewire-0.3)
          if [ -f stage/usr/lib/wine/arm64ec-windows/pipeasio64.dll ]; then
            emulated="  lib/wine/arm64ec-windows/pipeasio64.dll (PE front end for x86_64 hosts under FEX)"
          else
            emulated="  arm64ec-windows/pipeasio64.dll: not built on Debian (no arm64ec-windows import libraries)"
          fi
          printf '%s\n' \
            "PipeASIO ${TAG} - prebuilt binaries (Debian stable, aarch64)" \
            "" \
            "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "Commit:           ${GITHUB_SHA}" \
            "Wine (build SDK): $(wine --version)" \
            "glibc:            ${glibc}" \
            "libpipewire-0.3:  ${pipewire} (built against; minimum ${pipewire})" \
            "clang (PE halves): $(clang -dumpversion)" \
            "Kernel:           $(uname -sr)" \
            "" \
            "Contents:" \
            "  lib/wine/aarch64-windows/pipeasio64.dll (PE front end)" \
            "  lib/wine/aarch64-unix/pipeasio64.so     (unixlib: the PipeWire client)" \
            "${emulated}" \
            "  share/pipeasio/manager/pipeasio-check.exe (installation-only probe)" \
            "  bin/pipeasio-register, bin/pipeasio-manage" \
            "" \
            "Install (system-wide):  sudo tar -xzf <this>.tar.gz -C /usr && pipeasio-register" \
            "Install (user-local):   tar -xzf <this>.tar.gz -C \"\$HOME/.local\"" \
            "Wine outside /usr/lib:  Debian's own Wine reads" \
            "                        /usr/lib/aarch64-linux-gnu/wine, so set" \
            "                        WINEDLLPATH to this tree's lib/wine" \
            "" \
            "COMPATIBILITY: the ELF .so half is linked against the Wine and glibc" \
            "shown above. A different Wine version or an older glibc may fail to load" \
            "(regsvr32 c0000135). Build from source in that case. See the README." \
            "PipeWire is the exception: it is resolved at run time. This .so was" \
            "checked at release time against the libpipewire-0.3 shown above:" \
            "Debian stable's, the ARM64 floor, because Valve publishes no ARM64" \
            "steamrt4 runtime to check against." \
            > stage/usr/BUILD-INFO.txt
          cat stage/usr/BUILD-INFO.txt

      - name: Package tarball
        run: |
          art="pipeasio-${TAG}-debian-aarch64.tar.gz"
          tar -czf "$art" -C stage/usr .
          sha256sum "$art" | tee "$art.sha256"
          echo "ART=$art" >> "$GITHUB_ENV"

      - name: Generate release manifest
        run: >
          build/manager/pipeasio-manage manifest --version "$TAG" --asset "$ART"
          --root stage/usr --architecture aarch64 --wine-sdk "$(wine --version)"
          --output pipeasio-release-aarch64.json

      - name: Upload driver release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-driver-aarch64
          if-no-files-found: error
          path: |
            pipeasio-*.tar.gz
            pipeasio-*.tar.gz.sha256
            pipeasio-release-aarch64.json

  manager-appimage:
    name: Independent manager AppImage (x86_64)
    needs: archlinux-binaries
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk@sha256:2c4c6520a268ef53255d511ae5988e35855b39a4b6c1e9865d56e5011c76ec3e
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
    steps:
      - name: Install native manager packaging dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-wayland qt6-svg-dev \
            qt6-svg-plugins qt6-xdgdesktopportal-platformtheme \
            libyaml-cpp-dev libarchive-dev zlib1g-dev libssl-dev \
            libpipewire-0.3-dev pipewire-bin curl ca-certificates desktop-file-utils
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download prebuilt installation probes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manager-probes
          path: probes
      - name: Configure without a Wine SDK or PE compiler
        run: >
          cmake -B build-manager -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DRIVER=OFF -DBUILD_SETTINGS_PANEL=ON -DBUILD_MANAGER=ON -DBUILD_TESTS=OFF
          -DPIPEASIO_CHECK_EXECUTABLE="$PWD/probes/pipeasio-check.exe"
          -DPIPEASIO_CHECK32_EXECUTABLE="$PWD/probes/pipeasio-check32.exe"
      - name: Build manager
        run: cmake --build build-manager
      - name: Package independent AppImage
        run: scripts/package-manager.sh build-manager "pipeasio-manager-${TAG}-x86_64.AppImage"
      - name: Verify bundled backend dependencies
        run: |
          app="$PWD/build-manager-appimage/AppDir"
          LD_LIBRARY_PATH="$app/usr/lib" QT_PLUGIN_PATH="$app/usr/plugins" \
            "$app/usr/bin/pipeasio-manage" --help
          LD_LIBRARY_PATH="$app/usr/lib" "$app/usr/bin/pw-dump" --version
          test -f "$app/usr/plugins/tls/libqopensslbackend.so"
          test -f "$app/usr/share/pipeasio/manager/pipeasio-check.exe"
          test -f "$app/usr/share/pipeasio/manager/pipeasio-check32.exe"
      - name: Upload manager release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manager
          if-no-files-found: error
          path: |
            pipeasio-manager-*.AppImage
            pipeasio-manager-*.AppImage.sha256

  publish:
    name: Publish tagged release
    needs: [archlinux-binaries, debian-arm64-binaries, manager-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Merge the per-architecture manifests into the published one
        run: |
          # One stream, not two file arguments: --slurp over several files is
          # ambiguous across jq clones. Every top-level field comes from the
          # x86_64 manifest; only artifacts is replaced by the concatenation.
          cat dist/pipeasio-release-x86_64.json dist/pipeasio-release-aarch64.json \
            | jq -s '(.[0].version) as $v
                     | if any(.[]; .schema != 1 or .version != $v)
                       then error("manifest schema or version mismatch") else . end
                     | .[0] * {artifacts: map(.artifacts[])}' \
            > dist/pipeasio-release.json
          rm dist/pipeasio-release-x86_64.json dist/pipeasio-release-aarch64.json
          jq -e '[.artifacts[].architecture] | sort == ["aarch64", "x86_64"]' dist/pipeasio-release.json
      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          awk -v hdr="## [$ver]" 'index($0,hdr)==1{g=1;next} g&&/^## \[/{exit} g{print}' CHANGELOG.md | sed '/./,$!d' > notes.md
          printf '%s\n' "" "### Downloads" "" \
            "- \`pipeasio-manager-${TAG}-x86_64.AppImage\`: native manager with Qt, PipeWire, yaml-cpp and libarchive bundled. No driver build or interpreter required." \
            "- \`pipeasio-${TAG}-archlinux-x86_64.tar.gz\`: Arch/CachyOS driver binaries and manager files." \
            "- \`pipeasio-${TAG}-debian-aarch64.tar.gz\`: Debian stable ARM64 driver binaries and manager files. There is no ARM64 AppImage: run \`bin/pipeasio-manage\` from this tarball, or build the GUI from source." \
            "- \`pipeasio-release.json\`: checksums, native library requirements and Wine SDK metadata. Runtime compatibility is checked in the selected launcher." \
            >> notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "PipeASIO ${TAG}" --notes-file notes.md
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
