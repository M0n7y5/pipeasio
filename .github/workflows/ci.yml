name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm gcc cmake ninja pkgconf git clang wine libpipewire pipewire qt6-base mingw-w64-gcc yaml-cpp libarchive zlib
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format check (core tree only; tests/ are intentionally hand-aligned)
        run: clang-format --dry-run --Werror src/*.c include/*.h gui/*.cpp gui/*.hpp manager/*.c manager/*.cpp manager/*.hpp
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  build-32bit:
    name: 32-bit WoW64 build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain (with 32-bit glibc for the ABI layout assert)
        run: |
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm gcc cmake ninja pkgconf git curl wine libpipewire pipewire qt6-base mingw-w64-gcc lib32-glibc yaml-cpp libarchive zlib
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (BUILD_WOW64_32=ON)
        run: cmake -B build32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_WOW64_32=ON -DWINE_LIB_ROOT=/usr/lib/wine
      - name: Build (64-bit + 32-bit WoW64)
        run: cmake --build build32
      - name: Audit PipeWire imports against 1.4.2
        run: |
          set -euo pipefail
          deb='libpipewire-0.3-0t64_1.4.2-1%2Bsteamrt4.1%2Bbsrt4.2_amd64.deb'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL -o "$work/pw.deb" \
            "https://repo.steampowered.com/steamrt4/apt/pool/main/p/pipewire/${deb}"
          ( cd "$work" && ar x pw.deb && tar xf data.tar.* )
          floor_lib=("$work"/usr/lib/*/libpipewire-0.3.so.0.*)
          test -f "${floor_lib[0]}" || {
            echo "::error::no libpipewire in ${deb}"
            exit 1
          }
          tests/distro/check_pipewire_imports.sh "${floor_lib[0]}" \
            build32/x86_64-unix/pipeasio64.so build32/x86_64-unix/pipeasio32.so
      - name: Test
        run: ctest --test-dir build32 --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build32/Testing/Temporary/LastTest.log || true

  # Pinned Steam Runtime 4 SDK. Its PipeWire 1.4.2 must match the floor.
  build-steamrt4:
    name: build (Steam Runtime 4, PipeWire floor)
    runs-on: ubuntu-latest
    # steamrt4/sdk:4.0.20260714.251823
    container: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk@sha256:2c4c6520a268ef53255d511ae5988e35855b39a4b6c1e9865d56e5011c76ec3e
    steps:
      # Debian's wine64-tools installs winebuild-stable; the unsuffixed
      # winebuild/winegcc that cmake/WineDLL.cmake probes for come with wine.
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkg-config gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            wine wine64-tools libwine-dev git ca-certificates
      - name: Assert the PipeWire floor
        run: |
          want=1.4.2
          have="$(pkg-config --modversion libpipewire-0.3)"
          echo "libpipewire-0.3: ${have} (floor: ${want})"
          test "${have}" = "${want}" || {
            echo "::error::Expected PipeWire ${want}, got ${have}; update the image digest or project floor."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF
      - name: Build
        run: cmake --build build
      - name: Audit PipeWire imports against 1.4.2
        run: |
          floor_lib="$(pkg-config --variable=libdir libpipewire-0.3)/libpipewire-0.3.so.0"
          tests/distro/check_pipewire_imports.sh "$floor_lib" build/x86_64-unix/pipeasio64.so
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  # Distro package-build CFLAGS/LDFLAGS. Fedora is the issue #6 regression
  # case (-flto=auto). Arch is covered by build-and-test / build-32bit.
  build-distros:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False
              cmake ninja-build gcc g++ pkgconf mingw64-gcc mingw64-gcc-c++
              wine-devel pipewire-devel redhat-rpm-config git
            # RPM optflags must expand -flto (issue #6 regression guard).
            flags: |
              set -euo pipefail
              CFLAGS="$(rpm -E '%{optflags}')"
              LDFLAGS="$(rpm -E '%{build_ldflags}')"
              case "$CFLAGS" in
                *-flto*) echo "LTO guard: CFLAGS contain -flto (issue #6)" ;;
                *)
                  echo "::error::Fedora optflags lost -flto; issue #6 guard is stale"
                  exit 1
                  ;;
              esac
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
          - name: ubuntu
            image: ubuntu:latest
            install: >-
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update -qq &&
              apt-get install -y --no-install-recommends
              cmake ninja-build gcc g++ pkg-config gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
              wine64-tools libwine-dev libpipewire-0.3-dev pipewire
              dpkg-dev git ca-certificates
            flags: |
              set -euo pipefail
              export DEB_BUILD_MAINT_OPTIONS=hardening=+all
              CFLAGS="$(dpkg-buildflags --get CFLAGS) $(dpkg-buildflags --get CPPFLAGS)"
              LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
          # Debian stable: same dpkg toolchain as Ubuntu but older Wine and a
          # PipeWire at the project's 1.4.2 floor - the layout reported broken
          # in issue #20's follow-up (test hosts vs libwine-dev header split).
          - name: debian
            image: debian:stable
            install: >-
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update -qq &&
              apt-get install -y --no-install-recommends
              cmake ninja-build gcc g++ pkg-config gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
              wine64-tools libwine-dev libpipewire-0.3-dev pipewire
              dpkg-dev git ca-certificates
            flags: |
              set -euo pipefail
              export DEB_BUILD_MAINT_OPTIONS=hardening=+all
              CFLAGS="$(dpkg-buildflags --get CFLAGS) $(dpkg-buildflags --get CPPFLAGS)"
              LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
    steps:
      - name: Install toolchain
        run: ${{ matrix.install }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export distro build flags
        run: ${{ matrix.flags }}
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  # Native ARM64 build (#23). Debian is the ARM64 distribution whose Wine
  # ships the aarch64-windows import libraries (Fedora does not build Wine for
  # aarch64 at all; Asahi carries its own). They carry no arm64ec code, so the
  # front end is a plain aarch64 DLL; build-arm64x covers the hybrid. The
  # runner has no PipeWire daemon: the unit tests and the ABI layout run, the
  # Wine integration tests skip, and pipeasio-register in a throwaway prefix
  # proves the script finds the aarch64 pair and the loader pairs the aarch64
  # PE with the aarch64 unixlib.
  build-arm64:
    name: build (debian, aarch64)
    runs-on: ubuntu-24.04-arm
    container: docker.io/library/debian:stable
    steps:
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ clang lld pkg-config \
            wine wine64-tools libwine-dev libpipewire-0.3-dev pipewire git ca-certificates file
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF | tee configure.log
          grep -q 'ARM64 front end: aarch64 only' configure.log
      - name: Build
        run: cmake --build build
      - name: Assert the aarch64 front end and unixlib
        run: |
          set -euo pipefail
          ls -la build/aarch64-windows build/aarch64-unix
          file build/aarch64-windows/pipeasio64.dll build/aarch64-unix/pipeasio64.so
          test ! -e build/arm64ec-windows
      - name: Test (integration tests skip without a PipeWire daemon)
        run: ctest --test-dir build --output-on-failure
      - name: Register in a throwaway prefix
        run: |
          set -euo pipefail
          cmake --install build --prefix "$HOME/.local"
          # $HOME is the runner's mount, owned by another uid; Wine refuses to
          # create a prefix under it but accepts one that already exists.
          export WINEPREFIX="$HOME/pfx" WINEDLLPATH="$HOME/.local/lib/wine"
          export WINEDLLOVERRIDES="mscoree,mshtml=" WINEDEBUG=-all,+loaddll,err+all
          mkdir -p "$WINEPREFIX"
          wineboot --init
          PIPEASIO_PREFIX="$HOME/.local" "$HOME/.local/bin/pipeasio-register" 2>&1 | tee regsvr.log
          grep -q 'Successfully registered' regsvr.log
          grep -q 'aarch64-windows/pipeasio64.dll' regsvr.log
          wine reg query 'HKLM\Software\ASIO\PipeASIO' | grep -q 2D3CA9E2
          wineserver -w
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  # ARM64X (#23). Hangover's Wine is built for aarch64 and arm64ec and uses FEX
  # for x86_64 code, so against it the front end links as an ARM64X hybrid and
  # an x86_64 program, which is what Ableton is on ARM64, can load it. The x86_64
  # probe comes from MinGW gcc, like a real host. Without a PipeWire daemon it
  # must create the driver through COM and then fail Init at the PipeWire
  # connection, which the aarch64 unixlib makes: that proves the x64 view loads
  # and reaches the unixlib. The aarch64 probe takes the native view the same
  # way.
  build-arm64x:
    name: build (hangover, ARM64X)
    runs-on: ubuntu-24.04-arm
    container: docker.io/library/debian:trixie
    env:
      HANGOVER: "11.16"
      HANGOVER_SHA256: b5493f5903ab3c05f78bf4c03b06ac0005eb26f732437748c1592fefa45e861a
    steps:
      - name: Install toolchain and Hangover's Wine
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ clang lld llvm pkg-config libpipewire-0.3-dev \
            gcc-mingw-w64-x86-64-win32 curl ca-certificates git file
          tarball="hangover_${HANGOVER}_debian13_trixie_arm64.tar"
          curl -fsSLO "https://github.com/AndreRH/hangover/releases/download/hangover-${HANGOVER}/${tarball}"
          echo "${HANGOVER_SHA256}  ${tarball}" | sha256sum -c -
          tar -xf "$tarball" --wildcards 'hangover-*.deb'
          apt-get install -y --no-install-recommends ./hangover-wine_*.deb \
            ./hangover-wowbox64_*.deb ./hangover-libarm64ecfex_*.deb
          rm -f "$tarball" ./*.deb
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: |
          set -euo pipefail
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF | tee configure.log
          grep -q 'ARM64 front end: ARM64X' configure.log
      - name: Build
        run: cmake --build build
      - name: Assert the front end is an ARM64X hybrid
        run: |
          set -euo pipefail
          llvm-readobj --file-headers build/aarch64-windows/pipeasio64.dll | tee headers.txt
          grep -q 'Format: COFF-ARM64X' headers.txt
          grep -q 'Format: COFF-ARM64EC' headers.txt
          test ! -e build/arm64ec-windows
      - name: Test (integration tests skip without a PipeWire daemon)
        run: ctest --test-dir build --output-on-failure
      - name: Register in a throwaway prefix
        run: |
          set -euo pipefail
          cmake --install build --prefix "$HOME/.local"
          export WINEPREFIX="$HOME/pfx" WINEDLLPATH="$HOME/.local/lib/wine"
          export WINEDLLOVERRIDES="mscoree,mshtml=" WINEDEBUG=-all,+loaddll,err+all
          mkdir -p "$WINEPREFIX"
          wineboot --init
          PIPEASIO_PREFIX="$HOME/.local" "$HOME/.local/bin/pipeasio-register" 2>&1 | tee regsvr.log
          grep -q 'Successfully registered' regsvr.log
          wine reg query 'HKLM\Software\ASIO\PipeASIO' | grep -q 2D3CA9E2
          wineserver -w
      - name: Load the driver from an x86_64 and an aarch64 program
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc-win32 -mconsole -O0 -g tests/asio_probe/asio_probe.c -lole32 \
            -o asio_probe_x64.exe
          file asio_probe_x64.exe build/tests/asio_probe/asio_probe.exe
          export WINEPREFIX="$HOME/pfx" WINEDLLPATH="$HOME/.local/lib/wine"
          export WINEDLLOVERRIDES="mscoree,mshtml=" WINEDEBUG=-all,+loaddll,err+all
          export XDG_CONFIG_HOME="$HOME/pfx/xdg" PIPEASIO_CONNECT_TO_HARDWARE=off
          for probe in asio_probe_x64.exe build/tests/asio_probe/asio_probe.exe; do
            log="$(basename "$probe" .exe).log"
            timeout 180 wine "$probe" 2 > "$log" 2>&1 || true
            cat "$log"
            grep -q 'got IPipeASIO' "$log"
            grep 'Init failed:' "$log" | grep -qi pipewire
          done
          wineserver -w
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  manager-only:
    name: Manager without Wine build dependencies
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk@sha256:2c4c6520a268ef53255d511ae5988e35855b39a4b6c1e9865d56e5011c76ec3e
    steps:
      - name: Install native manager dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev libpipewire-0.3-dev \
            libyaml-cpp-dev libarchive-dev zlib1g-dev
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure manager only
        run: >
          cmake -B build-manager -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DRIVER=OFF -DBUILD_SETTINGS_PANEL=ON -DBUILD_MANAGER=ON
      - name: Build manager
        run: cmake --build build-manager
      - name: Test native manager and panel
        run: ctest --test-dir build-manager --output-on-failure
      - name: Install manager component
        run: cmake --install build-manager --prefix "$PWD/stage" --component Manager
      - name: Exercise installed backend
        run: stage/bin/pipeasio-manage --help
