name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm gcc cmake ninja pkgconf git clang wine libpipewire pipewire qt6-base
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format check (core tree only; tests/ are intentionally hand-aligned)
        run: clang-format --dry-run --Werror src/*.c include/*.h gui/*.cpp gui/*.hpp
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  build-32bit:
    name: 32-bit WoW64 build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain (with 32-bit glibc for the ABI layout assert)
        run: |
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm gcc cmake ninja pkgconf git curl wine libpipewire pipewire qt6-base mingw-w64-gcc lib32-glibc
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (BUILD_WOW64_32=ON)
        run: cmake -B build32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_WOW64_32=ON -DWINE_LIB_ROOT=/usr/lib/wine
      - name: Build (64-bit + 32-bit WoW64)
        run: cmake --build build32
      - name: Audit PipeWire imports against 1.4.2
        run: |
          set -euo pipefail
          deb='libpipewire-0.3-0t64_1.4.2-1%2Bsteamrt4.1%2Bbsrt4.2_amd64.deb'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL -o "$work/pw.deb" \
            "https://repo.steampowered.com/steamrt4/apt/pool/main/p/pipewire/${deb}"
          ( cd "$work" && ar x pw.deb && tar xf data.tar.* )
          floor_lib=("$work"/usr/lib/*/libpipewire-0.3.so.0.*)
          test -f "${floor_lib[0]}" || {
            echo "::error::no libpipewire in ${deb}"
            exit 1
          }
          tests/distro/check_pipewire_imports.sh "${floor_lib[0]}" \
            build32/pipeasio64.dll.so build32/pipeasio32.so
      - name: Test
        run: ctest --test-dir build32 --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build32/Testing/Temporary/LastTest.log || true

  # Pinned Steam Runtime 4 SDK. Its PipeWire 1.4.2 must match the floor.
  build-steamrt4:
    name: build (Steam Runtime 4, PipeWire floor)
    runs-on: ubuntu-latest
    # steamrt4/sdk:4.0.20260714.251823
    container: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk@sha256:2c4c6520a268ef53255d511ae5988e35855b39a4b6c1e9865d56e5011c76ec3e
    steps:
      # Debian's wine64-tools installs winebuild-stable; the unsuffixed
      # winebuild/winegcc that cmake/WineDLL.cmake probes for come with wine.
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkg-config \
            wine wine64-tools libwine-dev git ca-certificates
      - name: Assert the PipeWire floor
        run: |
          want=1.4.2
          have="$(pkg-config --modversion libpipewire-0.3)"
          echo "libpipewire-0.3: ${have} (floor: ${want})"
          test "${have}" = "${want}" || {
            echo "::error::Expected PipeWire ${want}, got ${have}; update the image digest or project floor."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF
      - name: Build
        run: cmake --build build
      - name: Audit PipeWire imports against 1.4.2
        run: |
          floor_lib="$(pkg-config --variable=libdir libpipewire-0.3)/libpipewire-0.3.so.0"
          tests/distro/check_pipewire_imports.sh "$floor_lib" build/pipeasio64.dll.so
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  # Distro package-build CFLAGS/LDFLAGS. Fedora is the issue #6 regression
  # case (-flto=auto). Arch is covered by build-and-test / build-32bit.
  build-distros:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False
              cmake ninja-build gcc g++ pkgconf
              wine-devel pipewire-devel redhat-rpm-config git
            # RPM optflags must expand -flto (issue #6 regression guard).
            flags: |
              set -euo pipefail
              CFLAGS="$(rpm -E '%{optflags}')"
              LDFLAGS="$(rpm -E '%{build_ldflags}')"
              case "$CFLAGS" in
                *-flto*) echo "LTO guard: CFLAGS contain -flto (issue #6)" ;;
                *)
                  echo "::error::Fedora optflags lost -flto; issue #6 guard is stale"
                  exit 1
                  ;;
              esac
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
          - name: ubuntu
            image: ubuntu:latest
            install: >-
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update -qq &&
              apt-get install -y --no-install-recommends
              cmake ninja-build gcc g++ pkg-config
              wine64-tools libwine-dev libpipewire-0.3-dev pipewire
              dpkg-dev git ca-certificates
            flags: |
              set -euo pipefail
              export DEB_BUILD_MAINT_OPTIONS=hardening=+all
              CFLAGS="$(dpkg-buildflags --get CFLAGS) $(dpkg-buildflags --get CPPFLAGS)"
              LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
          # Debian stable: same dpkg toolchain as Ubuntu but older Wine and a
          # PipeWire at the project's 1.4.2 floor - the layout reported broken
          # in issue #20's follow-up (test hosts vs libwine-dev header split).
          - name: debian
            image: debian:stable
            install: >-
              export DEBIAN_FRONTEND=noninteractive;
              apt-get update -qq &&
              apt-get install -y --no-install-recommends
              cmake ninja-build gcc g++ pkg-config
              wine64-tools libwine-dev libpipewire-0.3-dev pipewire
              dpkg-dev git ca-certificates
            flags: |
              set -euo pipefail
              export DEB_BUILD_MAINT_OPTIONS=hardening=+all
              CFLAGS="$(dpkg-buildflags --get CFLAGS) $(dpkg-buildflags --get CPPFLAGS)"
              LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
              {
                echo "CFLAGS=$CFLAGS"
                echo "LDFLAGS=$LDFLAGS"
              } >> "$GITHUB_ENV"
              echo "CFLAGS=$CFLAGS"
              echo "LDFLAGS=$LDFLAGS"
    steps:
      - name: Install toolchain
        run: ${{ matrix.install }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export distro build flags
        run: ${{ matrix.flags }}
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SETTINGS_PANEL=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Show test log on failure
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true
